name: Maestro iOS E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  maestro-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "${HOME}/.maestro/bin" >> $GITHUB_PATH

      - name: Start iOS Simulator
        run: |
          xcrun simctl create "iPhone 14" "iPhone 14" "iOS16.0"
          xcrun simctl boot "iPhone 14"

      - name: Build iOS App
        run: |
          npx expo install --fix
          npx eas build --platform ios --local --non-interactive

      - name: Install App on Simulator
        run: |
          xcrun simctl install "iPhone 14" *.app

      - name: Run Maestro Smoke Tests
        run: |
          maestro test maestro/smoke/ --format junit --output maestro-ios-smoke-results.xml

      - name: Run Maestro Flow Tests
        run: |
          maestro test maestro/flows/ --format junit --output maestro-ios-flows-results.xml
        continue-on-error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-ios-test-results
          path: |
            maestro-ios-*.xml
            maestro/screenshots/
