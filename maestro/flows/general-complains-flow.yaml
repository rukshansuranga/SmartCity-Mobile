---
appId: com.rukshansuranga.smartcity
name: General Complains Flow Test
---
# Test adding and viewing general complains
- launchApp
- extendedWaitUntil:
    visible:
      id: "logout-button"
    timeout: 15000
    optional: true
- tapOn:
    id: "logout-button"
    optional: true
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 10000
- assertVisible: "Sign In"
- assertVisible: "Sign Up"
- takeScreenshot: "./screenshots/auth_screen.png"

# Test Sign In Flow with Keycloak
- tapOn: "Sign In"

# Wait for Keycloak login page to load (increase timeout for OAuth)
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 15000

# Fill in Keycloak credentials
- tapOn: "Username or email"
- inputText: "amal"
- tapOn: "Password"
- inputText: "123"
- hideKeyboard

# Submit login
- tapOn: "Sign In"
- takeScreenshot: "./screenshots/keycloak_login_submitted.png"

# Wait for council selection screen
- extendedWaitUntil:
    visible: "Select Your Council"
    timeout: 15000
- takeScreenshot: "./screenshots/council_selection.png"

# Select a council
- tapOn: "-- Select a Council --"
- tapOn: "Mahara"
- tapOn: "Continue"

# Navigate to Complains section
- tapOn: "Complains"
- assertVisible: "Complains"

# Navigate to General Complains
- tapOn: "General"
- extendedWaitUntil:
    visible: "Complain List"
    timeout: 15000
- assertVisible:
    text: "Complain List"
- takeScreenshot: "./screenshots/general_complains_list.png"

# Test adding new general complain
- tapOn: "Add"
- extendedWaitUntil:
    visible: "Add Complain"
    timeout: 15000
- assertVisible: "Add Complain"

# Fill complain form
- tapOn: "Enter your complain"
- inputText: "Road Maintenance Issue ${new Date().getTime()}"
- tapOn: "Enter Description"
- inputText: "The road near sector 5 has several potholes that need immediate attention. Reported at ${new Date().toISOString()}"
- hideKeyboard
# - tapOn: "Category"
# - tapOn: "Infrastructure"
- takeScreenshot: "./screenshots/general_complain_form.png"

- extendedWaitUntil:
    visible:
      id: "document-picker-button"
    timeout: 10000

# Tap the document picker button

- tapOn:
    id: "document-picker-button"
- assertVisible: "test-document.pdf"
- assertVisible: "Description"

# Submit complain
- tapOn: "Add Complain"

# Verify complain appears in list
- extendedWaitUntil:
    visible: "Complain List"
    timeout: 15000
- assertVisible:
    text: "Complain List"
- takeScreenshot: "./screenshots/general_complains_list.png"
