---
appId: com.rukshansuranga.smartcity
name: Garbage Management Flow Test
---
# Test garbage management functionality
- launchApp

# Login
- tapOn: "Email"
- inputText: "test@smartcity.com"
- tapOn: "Password"
- inputText: "Test123!"
- tapOn: "Sign In"

# Navigate to Garbage section
- tapOn: "Garbage"
- assertVisible: "Garbage Management"
- takeScreenshot: "./screenshots/garbage_home.png"

# Test garbage tracking
- tapOn: "Tracking"
- assertVisible: "Garbage Tracking"
- takeScreenshot: "./screenshots/garbage_tracking.png"

# Test current location tracking
- tapOn: "Track Current Location"
- assertVisible: "Map"
- takeScreenshot: "./screenshots/garbage_tracking_map.png"

# Test schedule management
- tapOn: "Schedule"
- assertVisible: "Garbage Schedule"
- takeScreenshot: "./screenshots/garbage_schedule.png"

# Test viewing weekly schedule
- assertVisible: "Monday"
- assertVisible: "Tuesday"
- assertVisible: "Wednesday"
- assertVisible: "Thursday"
- assertVisible: "Friday"
- assertVisible: "Saturday"
- assertVisible: "Sunday"

# Test selecting a specific day
- tapOn: "Monday"
- assertVisible: "Monday Schedule"
- takeScreenshot: "./screenshots/garbage_monday_schedule.png"

# Test garbage collection status
- tapOn: "Collection Status"
- assertVisible: "Pending"
- assertVisible: "Completed"
- takeScreenshot: "./screenshots/garbage_collection_status.png"

# Test setting reminder
- tapOn: "Set Reminder"
- assertVisible: "Reminder Settings"
- tapOn: "Enable Notifications"
- tapOn: "Save Settings"
- assertVisible: "Reminder set successfully"
- takeScreenshot: "./screenshots/garbage_reminder_success.png"
